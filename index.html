<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved (or system) theme before paint so there's no flash, and
      // set an explicit light/dark class that Muse's overlay reads too.
      ;(function () {
        try {
          var t = localStorage.getItem('muse-site-theme') || 'system'
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          var r = document.documentElement
          r.classList.toggle('dark', dark)
          r.classList.toggle('light', !dark)
        } catch (e) {}
      })()
    </script>
    <title>Muse — visual editing for design engineers</title>
    <meta
      name="description"
      content="Point at your running React app, say what you want, and Muse rewrites the real source code. Try it live."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
