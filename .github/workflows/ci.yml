# CI — typecheck, the engine test harness, and both builds on every push/PR.
# Windows runner on the test job is deliberate: the engine's CRLF handling is
# load-bearing (the harness asserts byte-exact output incl. line endings) and
# the maintainer develops on Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:tokens
      - run: npm run lint:config
      - run: npm test

  # The gesture suite — the CLIENT half of the chain (gesture → request → write),
  # which the vitest harness above deliberately does not reach. Ubuntu only: the
  # CRLF handling that justifies the Windows matrix lives entirely in the engine,
  # and the `test` job already covers it there.
  #
  # retries: 0 is set in playwright.config.ts ON PURPOSE. The reorder drag
  # affordance is documented as unreliably mounted at press time, so a retry
  # would convert a known product flake into a green check. If this job goes red
  # intermittently, that is the suite doing its job — read it as a product bug
  # before touching the test.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Chromium only — the suite asserts on source bytes and computed style, so
      # cross-browser rendering differences are out of its remit.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # The overlay stylesheet is a committed, generated artifact. `npm run build`
      # regenerates it, so any drift between the committed copy and a fresh build
      # is a stale checkout — fail loudly rather than shipping a mismatched sheet.
      # Pinned to this ubuntu-only job on purpose: Tailwind/autoprefixer output can
      # differ across platforms, and the test job is a ubuntu+windows matrix.
      - run: git diff --exit-code -- src/muse/generated/overlayCss.ts

  muse-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/muse-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  # The publishable overlay (@thientran01/muse) — bundles the repo's src/muse +
  # server + babel into a self-contained dist, then smoke-tests that the built
  # entries export the expected surface (. / vite / next / babel).
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The bundled source lives under the repo root (src/muse, server), so its
      # imports (react, @phosphor-icons, @babel/*) resolve from the ROOT
      # node_modules — install those first, then the package's own build deps.
      - run: npm ci
      - run: npm install
        working-directory: packages/overlay
      - run: npm run build
        working-directory: packages/overlay
      - run: node smoke.mjs
        working-directory: packages/overlay
