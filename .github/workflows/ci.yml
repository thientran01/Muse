# CI — typecheck, the engine test harness, and both builds on every push/PR.
# Windows runner on the test job is deliberate: the engine's CRLF handling is
# load-bearing (the harness asserts byte-exact output incl. line endings) and
# the maintainer develops on Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:tokens
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # The overlay stylesheet is a committed, generated artifact. `npm run build`
      # regenerates it, so any drift between the committed copy and a fresh build
      # is a stale checkout — fail loudly rather than shipping a mismatched sheet.
      # Pinned to this ubuntu-only job on purpose: Tailwind/autoprefixer output can
      # differ across platforms, and the test job is a ubuntu+windows matrix.
      - run: git diff --exit-code -- src/muse/generated/overlayCss.ts

  muse-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/muse-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  # The publishable overlay (@thientran01/muse) — bundles the repo's src/muse +
  # server + babel into a self-contained dist, then smoke-tests that the built
  # entries export the expected surface (. / vite / next / babel).
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The bundled source lives under the repo root (src/muse, server), so its
      # imports (react, @phosphor-icons, @babel/*) resolve from the ROOT
      # node_modules — install those first, then the package's own build deps.
      - run: npm ci
      - run: npm install
        working-directory: packages/overlay
      - run: npm run build
        working-directory: packages/overlay
      - run: node smoke.mjs
        working-directory: packages/overlay
